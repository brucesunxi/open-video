[project]
name = "teacher-studio"
version = "0.1.0"
description = "Local-first virtual teacher orchestration and course workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "jieba==0.42.1", "rank-bm25==0.2.2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
