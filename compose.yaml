services:
  studio:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
